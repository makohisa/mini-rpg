<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ミニRPG</title>
<style>
  :root{
    --ink:#0b0f1a;
    --win:#101a3a;
    --line:#e8ecff;
    --gold:#ffd257;
    --hp:#57e08a;
    --mp:#59b6ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    color:var(--line); user-select:none; touch-action:manipulation;
  }
  #stage{position:relative;width:320px;height:240px;transform-origin:top center;}
  canvas{display:block;width:320px;height:240px;image-rendering:pixelated;background:#000;}

  /* --- ウィンドウ類（ドラクエ風の枠） --- */
  .win{
    position:absolute; background:var(--win); border:2px solid var(--line);
    border-radius:2px; padding:5px 7px; font-size:11px; line-height:1.5;
    box-shadow:0 0 0 2px #000;
  }
  #status{top:4px; left:4px; min-width:96px; font-size:10px;}
  #status b{color:var(--gold); font-weight:600;}
  #msg{left:6px; right:6px; bottom:6px; min-height:52px; display:none;}
  #msg .more{position:absolute;right:6px;bottom:2px;color:var(--gold);animation:bl .6s steps(2,end) infinite;}
  @keyframes bl{50%{opacity:0}}
  #cmd{right:6px; bottom:64px; display:none; min-width:96px;}
  #cmd div{padding:1px 4px; cursor:pointer;}
  #cmd div.sel{background:var(--line); color:var(--win); font-weight:700;}
  #ebar{left:6px; top:4px; display:none;}

  /* --- 操作パネル --- */
  #ctl{margin-top:14px;display:flex;gap:34px;align-items:center;justify-content:center;width:100%;max-width:420px;}
  #pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);}
  .btn{
    display:flex;align-items:center;justify-content:center;
    background:#1b2440;border:2px solid #46527d;border-radius:8px;
    color:var(--line);font-size:15px;font-weight:700;
  }
  .btn:active{background:#2f3d6b;}
  #acts{display:flex;gap:12px;}
  #acts .btn{width:56px;height:56px;border-radius:50%;font-size:12px;}
  #btnA{background:#2b3f7a;}
  .hint{font-size:10px;opacity:.5;margin-top:8px;text-align:center;}
</style>
</head>
<body>

<div id="stage">
  <canvas id="screen" width="320" height="240"></canvas>
  <div class="win" id="status"></div>
  <div class="win" id="ebar"></div>
  <div class="win" id="cmd"></div>
  <div class="win" id="msg"><span id="msgtext"></span><span class="more">▼</span></div>
</div>

<div id="ctl">
  <div id="pad">
    <div></div><div class="btn" data-k="up">▲</div><div></div>
    <div class="btn" data-k="left">◀</div><div></div><div class="btn" data-k="right">▶</div>
    <div></div><div class="btn" data-k="down">▼</div><div></div>
  </div>
  <div id="acts">
    <div class="btn" id="btnA" data-k="a">けってい</div>
    <div class="btn" id="btnB" data-k="b">キャンセル</div>
  </div>
</div>
<div class="hint">キーボード: 矢印キー / Z=けってい / X=キャンセル</div>

<script>
/* =========================================================
   ミニRPG  —  1ファイル完結
   構成: ①マップデータ ②プレイヤー ③敵 ④描画 ⑤移動 ⑥戦闘 ⑦入力
   ここをいじれば自分のゲームになります。
   ========================================================= */

const TILE = 16, VW = 20, VH = 15;      // タイル1枚=16px、画面は20x15タイル
const cv = document.getElementById('screen');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

/* ---------- ① マップデータ ----------
   記号の意味:
   .草  T木  W水  r道  #壁  D扉  $宝箱  ~/V/C/E ワープ  B ボス地点        */
const MAPS = {
  village: {
    name:'はじまりの村', encounter:false, bg:'#2e6b3a',
    data:[
      "TTTTTTTTTTTTTTTTTTTT",
      "T..................T",
      "T..#####....#####..T",
      "T..##D##....##D##..T",
      "T..................T",
      "T........rr........T",
      "T........rr........T",
      "T........rr........T",
      "T..#####.rr.#####..T",
      "T..##D##.rr.##D##..T",
      "T........rr........T",
      "T........rr........T",
      "T........rr........T",
      "TTTTTTTTT~~TTTTTTTTT",
      "TTTTTTTTTTTTTTTTTTTT"],
    warps:[{x:9,y:13,to:'field',tx:13,ty:2},{x:10,y:13,to:'field',tx:13,ty:2}],
    npcs:[
      {x:5,y:4,  c:'#d8d8e8', name:'むらびと', line:['きたの どうくつに','くろい りゅうが すみついた…','だれも かえって こない。']},
      {x:14,y:4, c:'#ffd257', name:'やどやのおやじ', inn:true},
      {x:5,y:10, c:'#8be0d8', name:'どうぐや', shop:true},
      {x:14,y:10,c:'#ff9a6b', name:'へいし', line:['レベル6くらいまで あげてから','どうくつに いくんだな。','どうぐは かならず もっていけ。']},
      {x:11,y:6, c:'#c58bff', name:'むらおさ', line:['よくきた ぼうけんしゃよ。','みなみの のはらを ぬけると','どうくつが ある。','りゅうを たおして きてくれ。']}
    ]
  },
  field: {
    name:'みなみの のはら', encounter:true, bg:'#2e6b3a', enemies:['slime','bat','goblin'],
    data:[
      "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
      "T........TTTVV.......TTT.....T",
      "T........TTT.........TTT.....T",
      "T...WWW......................T",
      "T...WWW......rr..............T",
      "T............rr..............T",
      "T......TTT...rr.......TTT....T",
      "T......TTT...rr.......TTT....T",
      "T............rr..............T",
      "T...........rrrr.............T",
      "T............rr..............T",
      "T....TTT.....rr.......WWWW...T",
      "T....TTT.....rr.......WWWW...T",
      "T............rr..............T",
      "T............rrrrrrrrrr......T",
      "T.....................r......T",
      "T......WWW............r......T",
      "T......WWW............C......T",
      "T............................T",
      "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"],
    warps:[{x:12,y:1,to:'village',tx:9,ty:12},{x:13,y:1,to:'village',tx:9,ty:12},
           {x:22,y:17,to:'cave',tx:9,ty:12}],
    npcs:[{x:20,y:15,c:'#ff9a6b',name:'たびびと',line:['この さきが どうくつだ。','やくそうは たりてるか？']}]
  },
  cave: {
    name:'りゅうの どうくつ', encounter:true, bg:'#20202c', enemies:['golem','mage'],
    data:[
      "####################",
      "#........B.........#",
      "#.####.######.####.#",
      "#.#$.#.#....#.#..#.#",
      "#.#..#.#.##.#.#..#.#",
      "#.#..#.#.##.#.#$.#.#",
      "#.#..#.#.##.#.#..#.#",
      "#.##.#.#.##.#.#.##.#",
      "#......#.##.#......#",
      "#.######.##.######.#",
      "#........##........#",
      "#.################.#",
      "#.........#........#",
      "#........E#........#",
      "####################"],
    warps:[{x:9,y:13,to:'field',tx:22,ty:16}],
    npcs:[],
    chests:{'3,3':{item:'やくそう', n:2}, '15,5':{ring:true}}
  }
};
const BLOCK = 'TW#D';                    // 通れないタイル

/* ---------- ② プレイヤー ---------- */
const LVUP = [0,12,30,60,105,170,260,380,540,760];  // 次のレベルに必要な累計EXP
const P = {
  map:'village', x:9, y:11, dir:'up',
  px:9*TILE, py:11*TILE, moving:false, mt:0, fx:0, fy:0, tx:0, ty:0,
  lv:1, exp:0, hp:32, mhp:32, mp:10, mmp:10, atk:9, def:5,
  gold:24, herb:3, water:0, seed:0, ring:false, bossDead:false, steps:0, encCount:12
};
function statsForLv(l){ return {mhp:24+l*8, mmp:7+l*3, atk:6+l*3, def:3+l*2}; }
function applyLv(){ const s = statsForLv(P.lv); P.mhp=s.mhp; P.mmp=s.mmp; P.atk=s.atk+(P.ring?5:0)+P.seed; P.def=s.def; }
applyLv(); P.hp=P.mhp; P.mp=P.mmp;

/* ---------- ③ 敵データ ---------- */
const ENEMY = {
  slime: {name:'スライム',   hp:14, atk:7,  def:2, exp:6,  g:7,  c:'#5fd0ff', shape:'blob'},
  bat:   {name:'コウモリ',   hp:18, atk:9,  def:3, exp:9,  g:10, c:'#b98bff', shape:'bat'},
  goblin:{name:'ゴブリン',   hp:26, atk:12, def:5, exp:14, g:16, c:'#7ec850', shape:'humanoid'},
  golem: {name:'ゴーレム',   hp:52, atk:18, def:9, exp:40, g:52, c:'#a89078', shape:'golem'},
  mage:  {name:'まどうし',   hp:36, atk:16, def:5, exp:36, g:48, c:'#ff6b9a', shape:'humanoid'},
  dragon:{name:'あんこくりゅう', hp:170, atk:24, def:12, exp:0, g:0, c:'#4a3b7a', shape:'dragon', boss:true}
};

/* ---------- 状態管理 ---------- */
let mode = 'field';          // field / msg / battle / over / end
let msgQueue = [], msgDone = null;
let B = null;                // 戦闘中のデータ
const elMsg = document.getElementById('msg'), elMsgT = document.getElementById('msgtext');
const elCmd = document.getElementById('cmd'), elSt = document.getElementById('status'), elEb = document.getElementById('ebar');

/* ---------- 選択ウィンドウ（はい/いいえ・商品リスト共用） ---------- */
let CH = null;                       // {list:[{t:表示, f:選んだときの処理}], sel, cancel}
function choose(list, cancel, sel){
  CH = {list, sel:Math.min(sel||0, list.length-1), cancel}; mode = 'choice'; showChoice();
}
function showChoice(){
  if(!CH){ elCmd.style.display='none'; return; }
  elCmd.style.display='block';
  elCmd.innerHTML = CH.list.map((o,i)=>`<div class="${i===CH.sel?'sel':''}">${o.t}</div>`).join('');
}
function pickChoice(i){
  const f = CH.list[i].f; CH = null; elCmd.style.display='none'; mode='field'; f();
}
function cancelChoice(){
  const c = CH.cancel; CH = null; elCmd.style.display='none'; mode='field'; if(c) c();
}

/* ---------- 宿屋 ---------- */
const INN = 12;
function openInn(){
  say(['やどやのおやじ:', `「ひとばん ${INN}ゴールドだ。`, '　とまって いくかい？」'], () => {
    choose([
      {t:'とまる', f:()=>{
        if(P.gold < INN) return say(['やどやのおやじ:','「おかねが たりないよ。」']);
        P.gold -= INN; P.hp = P.mhp; P.mp = P.mmp;
        say(['～ぐっすり ねむった～','HPとMPが ぜんかいした！']);
      }},
      {t:'やめる', f:()=>say(['やどやのおやじ:','「また どうぞ。」'])}
    ], ()=>say(['やどやのおやじ:','「また どうぞ。」']));
  });
}

/* ---------- 道具屋 ---------- */
const GOODS = [
  {name:'やくそう',     price: 8, info:'HPを32かいふく', buy:()=>P.herb++},
  {name:'まほうのみず', price:18, info:'MPを20かいふく', buy:()=>P.water++},
  {name:'ちからのたね', price:60, info:'こうげきが2あがる', buy:()=>{P.seed+=2; applyLv();}}
];
let shopSel = 0;                     // カーソル位置を覚えておく（連続購入をラクに）
function openShop(first){
  const show = () => {
    const list = GOODS.map((it, idx) => ({
      t: `${it.name} ${it.price}G`,
      f: () => {
        shopSel = idx;
        if(P.gold < it.price) return say(['どうぐや:','「おかねが たりないねぇ。」'], ()=>openShop(false));
        P.gold -= it.price; it.buy();
        say([`${it.name}を かった！`, `のこり ${P.gold}ゴールド`], ()=>openShop(false));
      }
    }));
    list.push({t:'やめる', f:()=>{ shopSel=0; say(['どうぐや:','「まいど。」']); }});
    choose(list, ()=>{ shopSel=0; say(['どうぐや:','「まいど。」']); }, shopSel);
  };
  if(first) say(['どうぐや:','「なにを かうかね？」'], show);
  else show();
}

function say(lines, after){
  msgQueue = msgQueue.concat(lines); msgDone = after || msgDone;
  if(mode !== 'battle') mode = 'msg';
  nextMsg(true);
}
function nextMsg(first){
  if(!first) msgQueue.shift();
  if(msgQueue.length === 0){
    elMsg.style.display='none';
    const f = msgDone; msgDone = null;
    if(mode === 'msg') mode = 'field';
    if(f) f();
    return;
  }
  elMsg.style.display='block';
  elMsgT.innerHTML = String(msgQueue[0]).replace(/\n/g,'<br>');
}

/* ---------- ④ 描画 ---------- */
function tileAt(m,x,y){
  const d = MAPS[m].data;
  if(y<0||y>=d.length||x<0||x>=d[0].length) return '#';
  return d[y][x];
}
function drawTile(t,sx,sy,bg){
  const g = cx;
  if(t==='T'){ g.fillStyle=bg; g.fillRect(sx,sy,16,16); g.fillStyle='#1d4a26'; g.fillRect(sx+2,sy+1,12,11); g.fillStyle='#2b6b36'; g.fillRect(sx+4,sy+2,8,7); g.fillStyle='#5a3d22'; g.fillRect(sx+7,sy+11,2,5); }
  else if(t==='W'){ g.fillStyle='#2a5aa8'; g.fillRect(sx,sy,16,16); g.fillStyle='#3f7ad4'; g.fillRect(sx+2,sy+4,6,2); g.fillRect(sx+9,sy+10,5,2); }
  else if(t==='#'){ g.fillStyle='#3b3b4e'; g.fillRect(sx,sy,16,16); g.fillStyle='#2a2a38'; g.fillRect(sx,sy+7,16,2); g.fillRect(sx+7,sy,2,7); g.fillRect(sx+3,sy+9,2,7); }
  else if(t==='D'){ g.fillStyle='#6b5030'; g.fillRect(sx,sy,16,16); g.fillStyle='#3a2a18'; g.fillRect(sx+3,sy+2,10,14); g.fillStyle='#ffd257'; g.fillRect(sx+10,sy+9,2,2); }
  else if(t==='r'){ g.fillStyle='#9c8558'; g.fillRect(sx,sy,16,16); g.fillStyle='#8a7449'; g.fillRect(sx+3,sy+4,3,3); g.fillRect(sx+10,sy+11,3,3); }
  else if(t==='$'){ g.fillStyle=bg; g.fillRect(sx,sy,16,16); g.fillStyle='#8a6a2e'; g.fillRect(sx+2,sy+5,12,9); g.fillStyle='#ffd257'; g.fillRect(sx+2,sy+7,12,2); g.fillRect(sx+7,sy+9,2,3); }
  else if(t==='B'){ g.fillStyle='#20202c'; g.fillRect(sx,sy,16,16); g.fillStyle='#5a2a3a'; g.fillRect(sx+4,sy+4,8,8); }
  else if('~VCE'.includes(t)){ g.fillStyle='#1a1a22'; g.fillRect(sx,sy,16,16); g.fillStyle='#000'; g.fillRect(sx+2,sy+3,12,13); }
  else { g.fillStyle=bg; g.fillRect(sx,sy,16,16);
         if(MAPS[P.map].name.includes('どうくつ')){ g.fillStyle='#2a2a36'; g.fillRect(sx,sy,16,16); g.fillStyle='#33333f'; g.fillRect(sx+4,sy+6,4,2);} 
         else { g.fillStyle='#357c44'; g.fillRect(sx+3,sy+6,3,2); g.fillRect(sx+10,sy+2,3,2); } }
}
function drawHero(sx,sy,dir){
  const g=cx;
  g.fillStyle='#00000044'; g.fillRect(sx+3,sy+14,10,2);
  g.fillStyle='#3a5fd0'; g.fillRect(sx+4,sy+7,8,7);          // 体
  g.fillStyle='#f0c39a'; g.fillRect(sx+4,sy+2,8,6);          // 顔
  g.fillStyle='#5a3d22'; g.fillRect(sx+3,sy+1,10,3);         // 髪
  g.fillStyle='#111';
  if(dir==='down'){ g.fillRect(sx+5,sy+5,2,2); g.fillRect(sx+9,sy+5,2,2); }
  else if(dir==='left'){ g.fillRect(sx+4,sy+5,2,2); }
  else if(dir==='right'){ g.fillRect(sx+10,sy+5,2,2); }
}
function drawNPC(n,sx,sy){
  const g=cx;
  g.fillStyle='#00000044'; g.fillRect(sx+3,sy+14,10,2);
  g.fillStyle=n.c; g.fillRect(sx+4,sy+7,8,7);
  g.fillStyle='#f0c39a'; g.fillRect(sx+4,sy+2,8,6);
  g.fillStyle='#111'; g.fillRect(sx+5,sy+5,2,2); g.fillRect(sx+9,sy+5,2,2);
}
function render(){
  if(mode === 'battle'){ renderBattle(); return; }
  const M = MAPS[P.map], mw = M.data[0].length, mh = M.data.length;
  const camX = Math.max(0, Math.min(mw*TILE - VW*TILE, Math.round(P.px) + 8 - VW*TILE/2));
  const camY = Math.max(0, Math.min(mh*TILE - VH*TILE, Math.round(P.py) + 8 - VH*TILE/2));
  cx.fillStyle = M.bg; cx.fillRect(0,0,320,240);
  const x0 = Math.floor(camX/TILE), y0 = Math.floor(camY/TILE);
  for(let y=y0; y<=y0+VH; y++) for(let x=x0; x<=x0+VW; x++){
    drawTile(tileAt(P.map,x,y), x*TILE-camX, y*TILE-camY, M.bg);
  }
  (M.npcs||[]).forEach(n => drawNPC(n, n.x*TILE-camX, n.y*TILE-camY));
  drawHero(Math.round(P.px)-camX, Math.round(P.py)-camY, P.dir);
  updateStatus();
}
function updateStatus(){
  elSt.style.display='block'; elEb.style.display='none';
  elSt.innerHTML = `<b>${MAPS[P.map].name}</b><br>Lv ${P.lv}　HP ${P.hp}/${P.mhp}<br>MP ${P.mp}/${P.mmp}　G ${P.gold}`;
}

/* ---------- ⑤ 移動 ---------- */
function passable(m,x,y){
  const t = tileAt(m,x,y);
  if(BLOCK.includes(t)) return false;
  if(t==='$') return false;
  if((MAPS[m].npcs||[]).some(n => n.x===x && n.y===y)) return false;
  return true;
}
function tryMove(dir){
  if(P.moving || mode !== 'field') return;
  P.dir = dir;
  const d = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
  const nx = P.x+d[0], ny = P.y+d[1];
  if(!passable(P.map,nx,ny)) return;
  P.fx=P.px; P.fy=P.py; P.tx=nx*TILE; P.ty=ny*TILE;
  P.x=nx; P.y=ny; P.moving=true; P.mt=0;
}
function onStep(){
  const M = MAPS[P.map], t = tileAt(P.map,P.x,P.y);
  const w = (M.warps||[]).find(w => w.x===P.x && w.y===P.y);
  if(w){ P.map=w.to; P.x=w.tx; P.y=w.ty; P.px=P.x*TILE; P.py=P.y*TILE;
         say([`${MAPS[P.map].name} に とうちゃくした。`]); return; }
  if(t==='B' && !P.bossDead){ startBattle('dragon'); return; }
  if(M.encounter){
    P.encCount--;
    if(P.encCount <= 0){
      P.encCount = 6 + Math.floor(Math.random()*12);
      startBattle(M.enemies[Math.floor(Math.random()*M.enemies.length)]);
    }
  }
}
function interact(){
  const d = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.dir];
  const fx = P.x+d[0], fy = P.y+d[1], M = MAPS[P.map];
  const npc = (M.npcs||[]).find(n => n.x===fx && n.y===fy);
  if(npc){
    if(npc.inn) openInn();
    else if(npc.shop) openShop(true);
    else say([`${npc.name}:`].concat(npc.line.map(l => '「'+l+'」')));
    return;
  }
  const key = fx+','+fy;
  if(M.chests && M.chests[key] && tileAt(P.map,fx,fy)==='$'){
    const c = M.chests[key];
    const row = M.data[fy]; M.data[fy] = row.slice(0,fx) + '.' + row.slice(fx+1);
    if(c.ring){ P.ring=true; applyLv(); say(['たからばこを あけた！','「ちからのゆびわ」を てにいれた！','こうげきりょくが 5 あがった！']); }
    else { P.herb += c.n; say(['たからばこを あけた！',`やくそうを ${c.n}こ てにいれた！`]); }
    return;
  }
  if(tileAt(P.map,fx,fy)==='D') say(['カギが かかっている。']);
}

/* ---------- ⑥ 戦闘 ---------- */
function startBattle(key){
  const e = ENEMY[key];
  B = { key, e, hp:e.hp, menu:'root', sel:0, lock:true };
  mode = 'battle';
  say([`${e.name} が あらわれた！`], () => { B.lock=false; showCmd(); });
}
const ROOT = ['たたかう','まほう','どうぐ','にげる'];
const MAGIC = ['ファイア (MP3)','ヒール (MP4)','もどる'];
function showCmd(){
  if(B.lock){ elCmd.style.display='none'; return; }
  const list = B.menu==='root' ? ROOT : B.menu==='magic' ? MAGIC : [`やくそう (${P.herb})`,`まほうのみず (${P.water})`,'もどる'];
  elCmd.style.display='block';
  elCmd.innerHTML = list.map((s,i)=>`<div class="${i===B.sel?'sel':''}">${s}</div>`).join('');
}
function battleSay(lines, after){ elCmd.style.display='none'; B.lock=true; say(lines, after); }
function dmg(atk,def){ return Math.max(1, Math.floor((atk*2-def)*(0.85+Math.random()*0.3)/2)); }

function playerAction(){
  const list = B.menu==='root' ? ROOT : B.menu==='magic' ? MAGIC : ['herb','back'];
  if(B.menu==='root'){
    if(B.sel===0){ const d = dmg(P.atk,B.e.def); B.hp-=d;
      battleSay(['ゆうしゃの こうげき！',`${B.e.name}に ${d}の ダメージ！`], afterPlayer); }
    else if(B.sel===1){ B.menu='magic'; B.sel=0; showCmd(); }
    else if(B.sel===2){ B.menu='item'; B.sel=0; showCmd(); }
    else {
      if(B.e.boss){ battleSay(['にげられない！'], afterPlayer); }
      else if(Math.random()<0.6){ battleSay(['うまく にげきれた！'], endBattle); }
      else battleSay(['まわりこまれて しまった！'], afterPlayer);
    }
  } else if(B.menu==='magic'){
    if(B.sel===0){
      if(P.mp<3) return battleSay(['MPが たりない！'], ()=>{B.lock=false;B.menu='root';B.sel=0;showCmd();});
      P.mp-=3; const d = 10+P.lv*3; B.hp-=d;
      battleSay(['ファイア！',`${B.e.name}に ${d}の ダメージ！`], afterPlayer);
    } else if(B.sel===1){
      if(P.mp<4) return battleSay(['MPが たりない！'], ()=>{B.lock=false;B.menu='root';B.sel=0;showCmd();});
      P.mp-=4; const h = Math.min(P.mhp-P.hp, 16+P.lv*3); P.hp+=h;
      battleSay(['ヒール！',`HPが ${h} かいふくした！`], afterPlayer);
    } else { B.menu='root'; B.sel=0; showCmd(); }
  } else {
    if(B.sel===0){
      if(P.herb<=0) return battleSay(['やくそうが ない！'], ()=>{B.lock=false;B.menu='root';B.sel=0;showCmd();});
      P.herb--; const h = Math.min(P.mhp-P.hp,32); P.hp+=h;
      battleSay(['やくそうを つかった！',`HPが ${h} かいふくした！`], afterPlayer);
    } else if(B.sel===1){
      if(P.water<=0) return battleSay(['まほうのみずが ない！'], ()=>{B.lock=false;B.menu='root';B.sel=0;showCmd();});
      P.water--; const h = Math.min(P.mmp-P.mp,20); P.mp+=h;
      battleSay(['まほうのみずを のんだ！',`MPが ${h} かいふくした！`], afterPlayer);
    } else { B.menu='root'; B.sel=0; showCmd(); }
  }
}
function afterPlayer(){
  B.menu='root'; B.sel=0;
  if(B.hp <= 0){
    const e = B.e;
    if(e.boss){ P.bossDead = true;
      return battleSay([`${e.name}を たおした！`,'どうくつに ひかりが さしこむ…'], ending); }
    P.exp += e.exp; P.gold += e.g;
    let lines = [`${e.name}を たおした！`, `${e.exp}の けいけんちと ${e.g}ゴールドを えた！`];
    while(P.lv < LVUP.length-1 && P.exp >= LVUP[P.lv]){
      P.lv++; const before = P.mhp; applyLv(); P.hp += (P.mhp-before); P.mp = P.mmp;
      lines.push(`レベルが ${P.lv} に あがった！`);
    }
    return battleSay(lines, endBattle);
  }
  // ボスは3割の確率で「やみのブレス」（防御を無視した固定ダメージ）
  const breath = B.e.boss && Math.random() < 0.3;
  const d = breath ? 42 : dmg(B.e.atk, P.def); P.hp -= d;
  const first = breath ? `${B.e.name}は やみのブレスを はいた！` : `${B.e.name}の こうげき！`;
  battleSay([first, `ゆうしゃは ${d}の ダメージを うけた！`], () => {
    if(P.hp <= 0){ P.hp = 0; return battleSay(['ゆうしゃは しんでしまった…'], gameOver); }
    B.lock=false; showCmd();
  });
}
function endBattle(){ B=null; mode='field'; elCmd.style.display='none'; }
function gameOver(){
  P.map='village'; P.x=9; P.y=11; P.px=144; P.py=176; P.dir='up';
  P.hp=P.mhp; P.mp=P.mmp; P.gold=Math.floor(P.gold/2); B=null; elCmd.style.display='none';
  say(['きがつくと 村の やどやに いた。','ゴールドが はんぶんに なっている…'], ()=>{mode='field';});
}
function ending(){
  mode='end'; elCmd.style.display='none'; elSt.style.display='none';
  say(['りゅうは ひかりとなって きえた。','のはらに へいわが もどった。','','～ THE END ～','','（リロードで さいしょから）'], ()=>{ mode='end'; });
}

function renderBattle(){
  const g = cx;
  g.fillStyle = '#0a0a14'; g.fillRect(0,0,320,240);
  for(let i=0;i<40;i++){ g.fillStyle='#15152a'; g.fillRect((i*53)%320,(i*31)%180,2,2); }
  g.fillStyle='#141428'; g.fillRect(0,170,320,70);
  const e = B.e, s = e.boss ? 3 : 2, cxp = 160, cyp = 110;
  g.save(); g.translate(cxp, cyp); g.scale(s,s); g.fillStyle=e.c;
  if(e.shape==='blob'){ g.beginPath(); g.arc(0,0,16,Math.PI,0); g.fill(); g.fillRect(-16,0,32,8);
    g.fillStyle='#111'; g.fillRect(-8,-6,4,4); g.fillRect(4,-6,4,4); }
  else if(e.shape==='bat'){ g.fillRect(-6,-6,12,12); g.beginPath(); g.moveTo(-6,-4); g.lineTo(-22,-12); g.lineTo(-22,6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(6,-4); g.lineTo(22,-12); g.lineTo(22,6); g.closePath(); g.fill();
    g.fillStyle='#ff4444'; g.fillRect(-4,-3,3,3); g.fillRect(1,-3,3,3); }
  else if(e.shape==='humanoid'){ g.fillRect(-9,-4,18,20); g.fillRect(-7,-18,14,14);
    g.fillStyle='#111'; g.fillRect(-4,-13,3,3); g.fillRect(1,-13,3,3); }
  else if(e.shape==='golem'){ g.fillRect(-14,-8,28,26); g.fillRect(-9,-24,18,16); g.fillRect(-20,-4,6,18); g.fillRect(14,-4,6,18);
    g.fillStyle='#ff8844'; g.fillRect(-5,-18,4,4); g.fillRect(1,-18,4,4); }
  else { g.fillRect(-16,-6,32,24); g.fillRect(-10,-24,22,18);
    g.beginPath(); g.moveTo(-14,-8); g.lineTo(-34,-30); g.lineTo(-30,2); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(14,-8); g.lineTo(34,-30); g.lineTo(30,2); g.closePath(); g.fill();
    g.fillStyle='#ff3355'; g.fillRect(-7,-19,5,5); g.fillRect(2,-19,5,5); }
  g.restore();
  elSt.style.display='block';
  elSt.innerHTML = `Lv ${P.lv}<br>HP <span style="color:var(--hp)">${P.hp}</span>/${P.mhp}<br>MP <span style="color:var(--mp)">${P.mp}</span>/${P.mmp}`;
  elEb.style.display='none';
}

/* ---------- ⑦ 入力 ---------- */
const held = {};
function press(k){
  if(mode==='end') return;
  if(mode==='msg' || (mode==='battle' && B && B.lock)){
    if(k==='a'||k==='b') nextMsg(false);
    return;
  }
  if(mode==='battle'){
    const len = B.menu==='root'?4 : B.menu==='magic'?3 : 3;
    if(k==='up') B.sel=(B.sel+len-1)%len, showCmd();
    else if(k==='down') B.sel=(B.sel+1)%len, showCmd();
    else if(k==='a') playerAction();
    else if(k==='b'){ if(B.menu!=='root'){ B.menu='root'; B.sel=0; showCmd(); } }
    return;
  }
  if(mode==='choice'){
    const n = CH.list.length;
    if(k==='up'){ CH.sel=(CH.sel+n-1)%n; showChoice(); }
    else if(k==='down'){ CH.sel=(CH.sel+1)%n; showChoice(); }
    else if(k==='a') pickChoice(CH.sel);
    else if(k==='b') cancelChoice();
    return;
  }
  if(mode==='field'){ if(k==='a') interact(); }
}
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
               KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Escape:'b'};
  const k = map[e.code]; if(!k) return;
  e.preventDefault();
  if(!held[k]) press(k);
  held[k] = true;
});
document.addEventListener('keyup', e => {
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
               KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Escape:'b'};
  const k = map[e.code]; if(k) held[k] = false;
});
document.querySelectorAll('[data-k]').forEach(el => {
  const k = el.dataset.k;
  const on = ev => { ev.preventDefault(); held[k]=true; press(k); };
  const off = ev => { ev.preventDefault(); held[k]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
});
elCmd.addEventListener('click', e => {
  const i = [...elCmd.children].indexOf(e.target.closest('div'));
  if(i < 0) return;
  if(mode==='choice' && CH){ CH.sel=i; showChoice(); pickChoice(i); return; }
  if(mode!=='battle'||!B||B.lock) return;
  B.sel=i; showCmd(); playerAction();
});
elMsg.addEventListener('click', () => press('a'));

/* ---------- メインループ ---------- */
const MOVE_MS = 150;
let last = performance.now();
function loop(now){
  const dt = Math.min(50, now-last); last = now;
  if(mode==='field'){
    if(P.moving){
      P.mt += dt; const t = Math.min(1, P.mt/MOVE_MS);
      P.px = P.fx + (P.tx-P.fx)*t; P.py = P.fy + (P.ty-P.fy)*t;
      if(t>=1){ P.moving=false; P.px=P.tx; P.py=P.ty; onStep(); }
    } else {
      if(held.up) tryMove('up'); else if(held.down) tryMove('down');
      else if(held.left) tryMove('left'); else if(held.right) tryMove('right');
    }
  }
  if(mode!=='end') render();
  requestAnimationFrame(loop);
}
function fit(){
  const s = Math.min(window.innerWidth/320, (window.innerHeight-190)/240, 3);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`;
  st.style.marginBottom = (240*(s-1)) + 'px';
}
window.addEventListener('resize', fit); fit();
say(['むらおさに はなしかけて','ぼうけんを はじめよう。']);
requestAnimationFrame(loop);
</script>
